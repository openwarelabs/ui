<!doctype html>
<html lang="en" data-theme="system">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Openware UI</title>
        <meta name="description" content="React components and design tokens with Commandr's look: tactile buttons, quiet surfaces and a brass accent, in light and dark." />
        <script>
            // Apply the saved theme before the page paints, so it never flashes the wrong one.
            try {
                var saved = localStorage.getItem("ow-docs-theme");
                if (saved === "light" || saved === "dark" || saved === "system") document.documentElement.dataset.theme = saved;
                // And the theme colour (docs/app/brands.ts writes it).
                var brand = JSON.parse(localStorage.getItem("ow-docs-brand") || "null");
                if (brand && brand.scale) {
                    var css = ":root:root, [data-theme][data-theme] {";
                    for (var step in brand.scale) css += "--ow-brand-" + step + ":" + brand.scale[step] + ";";
                    var style = document.createElement("style");
                    style.id = "docs-brand";
                    style.textContent = css + "}";
                    document.head.appendChild(style);
                }
            } catch (error) {}
        </script>
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0.3' y2='1'%3E%3Cstop offset='0' stop-color='%23312c7e'/%3E%3Cstop offset='1' stop-color='%2313112f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='23' cy='9' r='4' fill='%23d4a72c'/%3E%3C/svg%3E"
        />
        <link rel="stylesheet" href="./build/app.css" />
    </head>
    <body class="ow-app">
        <div id="root"></div>
        <script src="./build/app.js"></script>
    </body>
</html>
